name: Build SneakMC EndWar

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B package --no-transfer-progress

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SneakMC-EndWar
          path: target/*.jar
          if-no-files-found: error
